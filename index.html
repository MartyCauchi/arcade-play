function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
async function unlock(pw){
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  var out = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(P.i) }, key, b64(P.d));
  return new TextDecoder().decode(out);
}
async function go(pw, remember){
  var err = document.getElementById('err');
  err.textContent = 'Unlocking...';
  try{
    var html = await unlock(pw);
    try{ if(remember){ localStorage.setItem('eo.pw', pw); } }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    try{ localStorage.removeItem('eo.pw'); }catch(x){}
    err.textContent = 'Wrong password.';
  }
}
document.getElementById('f').addEventListener('submit', function(e){ e.preventDefault(); go(document.getElementById('pw').value, document.getElementById('rem').checked); });
try{ var saved = localStorage.getItem('eo.pw'); if(saved){ go(saved, true); } }catch(e){}
